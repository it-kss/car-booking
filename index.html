<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ระบบจองรถ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>

<body>

  <h2>🚗 ระบบจองรถ</h2>

  <div id="status">
    กำลังเริ่มระบบ...
  </div>


  <script>

    // =====================================
    // CONFIG
    // =====================================

    const LIFF_ID =
      '2011261923-yetmmlij';

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbwAqXQE9O2OGABOzbUrelsRqWv8holDq6sYXx2JQOAkgpBYftksidK0WKqPhxa30QK4/exec';


    // =====================================
    // MAIN
    // =====================================

    async function startLIFF() {

      const status =
        document.getElementById('status');


      try {

        // ---------------------------------
        // 1. เริ่ม LIFF
        // ---------------------------------

        status.innerText =
          '1. กำลังเริ่ม LIFF...';

        await liff.init({
          liffId: LIFF_ID
        });


        // ---------------------------------
        // 2. ตรวจ Login
        // ---------------------------------

        status.innerText =
          '2. กำลังตรวจสอบ LINE Login...';


        if (!liff.isLoggedIn()) {

          status.innerText =
            'กำลังเข้าสู่ระบบ LINE...';

          liff.login();

          return;

        }


        // ---------------------------------
        // 3. อ่านข้อมูล LINE
        // ---------------------------------

        status.innerText =
          '3. กำลังอ่านข้อมูลผู้ใช้งาน...';


        const profile =
          await liff.getProfile();


        const lineUserId =
          profile.userId;

        const name =
          profile.displayName;


        // ---------------------------------
        // 4. แสดงข้อมูลเบื้องต้น
        // ---------------------------------

        status.innerHTML =

          '👤 ชื่อ: ' +
          name +
          '<br><br>' +

          '🆔 LINE User ID: ' +
          lineUserId +
          '<br><br>' +

          '4. กำลังตรวจสอบสิทธิ์...';


        // ---------------------------------
        // 5. ตรวจสอบ User กับ Apps Script
        // ---------------------------------

        const url =

          GAS_URL +

          '?action=checkLIFFUser' +

          '&lineUserId=' +

          encodeURIComponent(lineUserId);


        const response =
          await fetch(url);


        const result =
          await response.json();


        console.log(
          'CHECK USER:',
          result
        );


        // ---------------------------------
        // 6. ตรวจสอบผล
        // ---------------------------------

        if (!result.success) {

          throw new Error(
            result.message ||
            'เกิดข้อผิดพลาดในการตรวจสอบผู้ใช้'
          );

        }


        // ---------------------------------
        // 7. ไม่พบ User
        // ---------------------------------

        if (!result.found) {

          status.innerHTML =

            '❌ ไม่พบผู้ใช้งานในระบบ' +

            '<br><br>' +

            'LINE ของคุณยังไม่ได้รับอนุญาต' +

            '<br>' +

            'กรุณาติดต่อผู้ดูแลระบบ';

          return;

        }


        // ---------------------------------
        // 8. ตรวจ Status
        // ---------------------------------

        if (
          String(result.status)
            .toLowerCase() !== 'active'
        ) {

          status.innerHTML =

            '⛔ บัญชีของคุณไม่สามารถใช้งานได้' +

            '<br><br>' +

            'Status: ' +
            result.status;

          return;

        }


        // ---------------------------------
        // 9. ผ่าน
        // ---------------------------------

        status.innerHTML =

          '👤 ชื่อ: ' +
          result.name +

          '<br><br>' +

          '🆔 LINE User ID: ' +
          result.lineUserId +

          '<br><br>' +

          '🏢 Department: ' +
          (result.department || '-') +

          '<br><br>' +

          '✅ ตรวจสอบสิทธิ์สำเร็จ' +

          '<br><br>' +

          'กำลังเข้าสู่ระบบ...';


      } catch (error) {

        console.error(error);


        status.innerHTML =

          '❌ เกิดข้อผิดพลาด' +

          '<br><br>' +

          error.message;

      }

    }


    // =====================================
    // START
    // =====================================

    startLIFF();

  </script>

</body>

</html>
