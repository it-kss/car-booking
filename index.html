<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ระบบจองรถ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>


<body>

  <h2>🚗 ระบบจองรถ</h2>

  <div id="app">

    <div id="status">
      กำลังเริ่มระบบ...
    </div>

  </div>


  <script>

    // =====================================
    // CONFIG
    // =====================================

    const LIFF_ID =
      '2011261923-yetmmlij';

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbwAqXQE9O2OGABOzbUrelsRqWv8holDq6sYXx2JQOAkgpBYftksidK0WKqPhxa30QK4/exec';


    // =====================================
    // START LIFF
    // =====================================

    async function startLIFF() {

      const status =
        document.getElementById('status');


      try {

        // ---------------------------------
        // 1. LIFF INIT
        // ---------------------------------

        status.innerText =
          '1. กำลังเริ่ม LIFF...';

        await liff.init({
          liffId: LIFF_ID
        });


        // ---------------------------------
        // 2. LOGIN
        // ---------------------------------

        status.innerText =
          '2. กำลังตรวจสอบ LINE Login...';


        if (!liff.isLoggedIn()) {

          liff.login();

          return;

        }


        // ---------------------------------
        // 3. GET PROFILE
        // ---------------------------------

        status.innerText =
          '3. กำลังอ่านข้อมูลผู้ใช้งาน...';


        const profile =
          await liff.getProfile();


        const lineUserId =
          profile.userId;

        const name =
          profile.displayName;


        // ---------------------------------
        // 4. CHECK USER
        // ---------------------------------

        status.innerText =
          '4. กำลังตรวจสอบสิทธิ์...';


        const url =

          GAS_URL +

          '?action=checkLIFFUser' +

          '&lineUserId=' +

          encodeURIComponent(lineUserId);


        const response =
          await fetch(url);


        const result =
          await response.json();


        console.log(
          'CHECK USER:',
          result
        );


        // ---------------------------------
        // 5. CHECK RESULT
        // ---------------------------------

        if (!result.success) {

          throw new Error(
            result.message ||
            'ไม่สามารถตรวจสอบผู้ใช้งานได้'
          );

        }


        // ---------------------------------
        // 6. USER NOT FOUND
        // ---------------------------------

        if (!result.found) {

          status.innerHTML =

            '❌ ไม่พบผู้ใช้งานในระบบ' +

            '<br><br>' +

            'LINE ของคุณยังไม่ได้รับอนุญาต' +

            '<br>' +

            'กรุณาติดต่อผู้ดูแลระบบ';

          return;

        }


        // ---------------------------------
        // 7. CHECK STATUS
        // ---------------------------------

        if (
          String(result.status)
            .toLowerCase() !== 'active'
        ) {

          status.innerHTML =

            '⛔ บัญชีของคุณไม่สามารถใช้งานได้' +

            '<br><br>' +

            'Status: ' +
            result.status;

          return;

        }


        // ---------------------------------
        // 8. SHOW MAIN MENU
        // ---------------------------------

        showMainMenu(result);


      } catch (error) {

        console.error(error);


        status.innerHTML =

          '❌ เกิดข้อผิดพลาด' +

          '<br><br>' +

          error.message;

      }

    }


    // =====================================
    // MAIN MENU
    // =====================================

    function showMainMenu(user) {

      const app =
        document.getElementById('app');


      app.innerHTML = `

        <h3>🚗 ระบบจองรถ</h3>

        <p>
          👤 ชื่อ: ${user.name}
        </p>

        <p>
          🏢 Department:
          ${user.department || '-'}
        </p>

        <hr>

        <button
          onclick="openBooking()"
        >
          🚗 จองรถ
        </button>

        <br><br>

        <button
          onclick="openMyBookings()"
        >
          📋 รายการจองของฉัน
        </button>

        <br><br>

        <button
          onclick="openMileage()"
        >
          🛣️ ประวัติการใช้รถ
        </button>

      `;

    }


    // =====================================
    // MENU FUNCTIONS
    // =====================================

    async function openBooking() {

  const app =
    document.getElementById('app');


  app.innerHTML = `
    <h3>🚗 จองรถ</h3>

    <div id="bookingStatus">
      กำลังโหลดรายการรถ...
    </div>
  `;


  try {

    const profile =
      await liff.getProfile();


    const url =

      GAS_URL +

      '?action=getAvailableCars' +

      '&lineUserId=' +

      encodeURIComponent(
        profile.userId
      );


    const response =
      await fetch(url);


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        'ไม่สามารถโหลดข้อมูลรถได้'
      );

    }


    if (
      !result.cars ||
      result.cars.length === 0
    ) {

      app.innerHTML = `
        <h3>🚗 จองรถ</h3>

        <p>
          ไม่พบรถที่พร้อมใช้งาน
        </p>

        <button
          onclick="location.reload()"
        >
          กลับหน้าหลัก
        </button>
      `;

      return;

    }


    let options = '';


    result.cars.forEach(
      car => {

        const label =

          [
            car.carType,
            car.brand,
            car.model,
            car.licensePlate
          ]
          .filter(Boolean)
          .join(' - ');


        options += `
          <option
            value="${car.carId}"
          >
            ${label}
          </option>
        `;

      }
    );


    app.innerHTML = `

      <h3>🚗 จองรถ</h3>

      <label>
        เลือกรถ
      </label>

      <br><br>

      <select
        id="carId"
      >
        ${options}
      </select>

      <br><br>

      <button
        onclick="location.reload()"
      >
        กลับหน้าหลัก
      </button>

    `;


  } catch (error) {

    app.innerHTML = `

      <h3>🚗 จองรถ</h3>

      <p>
        ❌ ${error.message}
      </p>

      <button
        onclick="location.reload()"
      >
        กลับหน้าหลัก
      </button>

    `;

  }

}


    // =====================================
    // START
    // =====================================

    startLIFF();

  </script>

</body>

</html>
