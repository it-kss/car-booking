<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ระบบจองรถ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
      line-height: 1.5;
    }

    button,
    select,
    input,
    textarea {
      font-size: 16px;
    }

    button {
      padding: 10px 14px;
      cursor: pointer;
    }

    select,
    input,
    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 9px;
      margin-top: 4px;
    }

    .booking-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .danger-button {
      margin-top: 8px;
    }
  </style>
</head>


<body>

  <h2>🚗 ระบบจองรถ</h2>

  <div id="app">
    <div id="status">
      กำลังเริ่มระบบ...
    </div>
  </div>


  <script>

    // =====================================
    // CONFIG
    // =====================================

    const LIFF_ID =
      '2011261923-yetmmlij';

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbwAqXQE9O2OGABOzbUrelsRqWv8holDq6sYXx2JQOAkgpBYftksidK0WKqPhxa30QK4/exec';

    let pendingBooking = null;


    // =====================================
    // HELPERS
    // =====================================

    function escapeHtml(text) {

      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    function formatDateTime(date) {

      if (
        !(date instanceof Date) ||
        isNaN(date.getTime())
      ) {
        return '-';
      }

      return date.toLocaleString(
        'th-TH',
        {
          dateStyle: 'medium',
          timeStyle: 'short'
        }
      );

    }


    async function fetchJson(url) {

      const response =
        await fetch(url);

      const text =
        await response.text();

      let result;

      try {

        result =
          JSON.parse(text);

      } catch (error) {

        console.error(
          'NON JSON RESPONSE:',
          text
        );

        throw new Error(
          'Server ตอบกลับไม่ใช่ JSON'
        );

      }

      return result;

    }


    // =====================================
    // START LIFF
    // =====================================

    async function startLIFF() {

      const status =
        document.getElementById(
          'status'
        );

      try {

        status.innerText =
          '1. กำลังเริ่ม LIFF...';

        await liff.init({
          liffId: LIFF_ID
        });


        status.innerText =
          '2. กำลังตรวจสอบ LINE Login...';


        if (!liff.isLoggedIn()) {

          liff.login();

          return;

        }


        status.innerText =
          '3. กำลังอ่านข้อมูลผู้ใช้งาน...';


        const profile =
          await liff.getProfile();


        const lineUserId =
          profile.userId;


        status.innerText =
          '4. กำลังตรวจสอบสิทธิ์...';


        const url =

          GAS_URL +

          '?action=checkLIFFUser' +

          '&lineUserId=' +

          encodeURIComponent(
            lineUserId
          );


        const result =
          await fetchJson(url);


        console.log(
          'CHECK USER:',
          result
        );


        if (!result.success) {

          throw new Error(
            result.message ||
            'ไม่สามารถตรวจสอบผู้ใช้งานได้'
          );

        }


        if (!result.found) {

          status.innerHTML =

            '❌ ไม่พบผู้ใช้งานในระบบ' +

            '<br><br>' +

            'LINE ของคุณยังไม่ได้รับอนุญาต' +

            '<br>' +

            'กรุณาติดต่อผู้ดูแลระบบ';

          return;

        }


        if (
          String(result.status)
            .trim()
            .toLowerCase() !==
          'active'
        ) {

          status.innerHTML =

            '⛔ บัญชีของคุณไม่สามารถใช้งานได้' +

            '<br><br>' +

            'Status: ' +

            escapeHtml(
              result.status
            );

          return;

        }


        showMainMenu(result);


      } catch (error) {

        console.error(error);


        status.innerHTML =

          '❌ เกิดข้อผิดพลาด' +

          '<br><br>' +

          escapeHtml(
            error.message
          );

      }

    }


    // =====================================
    // MAIN MENU
    // =====================================

    function showMainMenu(user) {

      const app =
        document.getElementById(
          'app'
        );


      app.innerHTML = `

        <h3>🚗 ระบบจองรถ</h3>

        <p>
          👤 ชื่อ:
          ${escapeHtml(
            user.name || '-'
          )}
        </p>

        <p>
          🏢 Department:
          ${escapeHtml(
            user.department || '-'
          )}
        </p>

        <hr>

        <button
          onclick="openBooking()"
        >
          🚗 จองรถ
        </button>

        <br><br>

        <button
          onclick="openMyBookings()"
        >
          📋 รายการจองทั้งหมด
        </button>

        <br><br>

        <button
          onclick="openMileage()"
        >
          🛣️ ประวัติการใช้รถ
        </button>

      `;

    }


    // =====================================
    // รายการจองทั้งหมด
    // =====================================

    async function openMyBookings() {

      const app =
        document.getElementById(
          'app'
        );


      app.innerHTML = `

        <h3>
          📋 รายการจองทั้งหมด
        </h3>

        <div>
          กำลังโหลดรายการจอง...
        </div>

      `;


      try {

        const profile =
          await liff.getProfile();

        const lineUserId =
          profile.userId;


        // อ่าน User ปัจจุบัน
        const userUrl =

          GAS_URL +

          '?action=checkLIFFUser' +

          '&lineUserId=' +

          encodeURIComponent(
            lineUserId
          );


        const userResult =
          await fetchJson(
            userUrl
          );


        if (
          !userResult.success ||
          !userResult.found
        ) {

          throw new Error(
            'ไม่พบข้อมูลผู้ใช้งาน'
          );

        }


        const currentUserId =
          String(
            userResult.userId || ''
          ).trim();


        const url =

          GAS_URL +

          '?action=getAllBookings' +

          '&lineUserId=' +

          encodeURIComponent(
            lineUserId
          );


        const result =
          await fetchJson(url);


        console.log(
          'GET ALL BOOKINGS:',
          result
        );


        if (!result.success) {

          throw new Error(
            result.message ||
            'ไม่สามารถโหลดรายการจองได้'
          );

        }


        if (
          !result.bookings ||
          result.bookings.length === 0
        ) {

          app.innerHTML = `

            <h3>
              📋 รายการจองทั้งหมด
            </h3>

            <p>
              ยังไม่มีรายการจอง
            </p>

            <button
              onclick="location.reload()"
            >
              ↩️ กลับหน้าหลัก
            </button>

          `;

          return;

        }


        let html = `

          <h3>
            📋 รายการจองทั้งหมด
          </h3>

        `;


        result.bookings
          .forEach(booking => {

            const bookingUserId =
              String(
                booking.userId || ''
              ).trim();

            const bookingStatus =
              String(
                booking.status || ''
              )
              .trim()
              .toUpperCase();

            const canCancel =

              bookingUserId ===
                currentUserId &&

              bookingStatus ===
                'BOOKED';


            const safeBookingId =
              escapeHtml(
                String(
                  booking.bookingId || '-'
                )
              );


            html += `

              <div
                class="booking-card"
              >

                <p>
                  🔢 เลขที่การจอง:
                  <strong>
                    ${safeBookingId}
                  </strong>
                </p>

                <p>
                  👤 ผู้จอง:
                  ${escapeHtml(
                    booking.userName || '-'
                  )}
                </p>

                <p>
                  🚘 รถ:
                  ${escapeHtml(
                    booking.carId || '-'
                  )}
                </p>

                <p>
                  📅 เริ่ม:
                  ${formatDateTime(
                    new Date(
                      booking.startDateTime
                    )
                  )}
                </p>

                <p>
                  📅 คืน:
                  ${formatDateTime(
                    new Date(
                      booking.endDateTime
                    )
                  )}
                </p>

                <p>
                  📍 สถานที่:
                  ${escapeHtml(
                    booking.destination || '-'
                  )}
                </p>

                <p>
                  📝 วัตถุประสงค์:
                  ${escapeHtml(
                    booking.purpose || '-'
                  )}
                </p>

                <p>
                  📌 สถานะ:
                  <strong>
                    ${escapeHtml(
                      bookingStatus || '-'
                    )}
                  </strong>
                </p>

                ${
                  canCancel
                    ? `
                      <button
                        class="danger-button"
                        data-booking-id="${safeBookingId}"
                        onclick="cancelBookingUI(this.dataset.bookingId)"
                      >
                        ❌ ยกเลิกการจอง
                      </button>
                    `
                    : ''
                }

              </div>

            `;

          });


        html += `

          <br>

          <button
            onclick="location.reload()"
          >
            ↩️ กลับหน้าหลัก
          </button>

        `;


        app.innerHTML =
          html;


      } catch (error) {

        console.error(error);


        app.innerHTML = `

          <h3>
            📋 รายการจองทั้งหมด
          </h3>

          <p>
            ❌
            ${escapeHtml(
              error.message
            )}
          </p>

          <button
            onclick="location.reload()"
          >
            ↩️ กลับหน้าหลัก
          </button>

        `;

      }

    }


    // =====================================
    // ยกเลิกการจอง
    // =====================================

    async function cancelBookingUI(
      bookingId
    ) {

      const confirmed =
        confirm(
          'ต้องการยกเลิกการจอง ' +
          bookingId +
          ' ใช่หรือไม่?'
        );


      if (!confirmed) {

        return;

      }


      const app =
        document.getElementById(
          'app'
        );


      try {

        app.innerHTML = `

          <h3>
            ⏳ กำลังยกเลิกการจอง...
          </h3>

          <p>
            Booking ID:
            ${escapeHtml(
              bookingId
            )}
          </p>

        `;


        const profile =
          await liff.getProfile();

        const lineUserId =
          profile.userId;


        const url =

          GAS_URL +

          '?action=cancelBooking' +

          '&lineUserId=' +

          encodeURIComponent(
            lineUserId
          ) +

          '&bookingId=' +

          encodeURIComponent(
            bookingId
          );


        const result =
          await fetchJson(url);


        console.log(
          'CANCEL BOOKING:',
          result
        );


        if (!result.success) {

          throw new Error(
            result.message ||
            'ไม่สามารถยกเลิกการจองได้'
          );

        }


        app.innerHTML = `

          <h3>
            ✅ ยกเลิกการจองสำเร็จ
          </h3>

          <p>
            ${escapeHtml(
              result.message ||
              'ยกเลิกเรียบร้อยแล้ว'
            )}
          </p>

          <button
            onclick="openMyBookings()"
          >
            📋 กลับไปรายการจอง
          </button>

          <br><br>

          <button
            onclick="location.reload()"
          >
            ↩️ กลับหน้าหลัก
          </button>

        `;


      } catch (error) {

        console.error(error);


        app.innerHTML = `

          <h3>
            ❌ ไม่สามารถยกเลิกการจองได้
          </h3>

          <p>
            ${escapeHtml(
              error.message
            )}
          </p>

          <button
            onclick="openMyBookings()"
          >
            📋 กลับไปรายการจอง
          </button>

        `;

      }

    }


    // =====================================
    // จองรถ
    // =====================================

    async function openBooking() {

      const app =
        document.getElementById(
          'app'
        );


      app.innerHTML = `

        <h3>🚗 จองรถ</h3>

        <div>
          กำลังโหลดรายการรถ...
        </div>

      `;


      try {

        const profile =
          await liff.getProfile();

        const lineUserId =
          profile.userId;


        const url =

          GAS_URL +

          '?action=getAvailableCars' +

          '&lineUserId=' +

          encodeURIComponent(
            lineUserId
          );


        const result =
          await fetchJson(url);


        if (!result.success) {

          throw new Error(
            result.message ||
            'ไม่สามารถโหลดข้อมูลรถได้'
          );

        }


        if (
          !result.cars ||
          result.cars.length === 0
        ) {

          app.innerHTML = `

            <h3>🚗 จองรถ</h3>

            <p>
              ❌ ไม่พบรถที่พร้อมใช้งาน
            </p>

            <button
              onclick="location.reload()"
            >
              กลับหน้าหลัก
            </button>

          `;

          return;

        }


        let options =
          '';


        result.cars
          .forEach(car => {

            const label = [

              car.carType,

              car.brand,

              car.model,

              car.licensePlate

            ]
            .filter(Boolean)
            .join(' - ');


            options += `

              <option
                value="${escapeHtml(
                  car.carId
                )}"
              >
                ${escapeHtml(
                  label
                )}
              </option>

            `;

          });


        app.innerHTML = `

          <h3>🚗 จองรถ</h3>


          <label>
            🚘 เลือกรถ
          </label>

          <select
            id="carId"
          >

            <option value="">
              -- เลือกรถ --
            </option>

            ${options}

          </select>


          <br><br>


          <label>
            📅 วันและเวลาเริ่มใช้รถ
          </label>

          <input
            type="datetime-local"
            id="startDateTime"
          >


          <br><br>


          <label>
            📅 วันและเวลาคืนรถ
          </label>

          <input
            type="datetime-local"
            id="endDateTime"
          >


          <br><br>


          <label>
            📍 สถานที่ไป
          </label>

          <input
            type="text"
            id="destination"
            placeholder="เช่น สนามบินภูเก็ต"
          >


          <br><br>


          <label>
            📝 วัตถุประสงค์
          </label>

          <textarea
            id="purpose"
            rows="3"
            placeholder="เช่น รับส่งแขก"
          ></textarea>


          <br><br>


          <button
            onclick="reviewBookingForm()"
          >
            ตรวจสอบข้อมูล
          </button>


          <br><br>


          <button
            onclick="location.reload()"
          >
            ↩️ กลับหน้าหลัก
          </button>

        `;


      } catch (error) {

        console.error(error);


        app.innerHTML = `

          <h3>🚗 จองรถ</h3>

          <p>
            ❌
            ${escapeHtml(
              error.message
            )}
          </p>

          <button
            onclick="location.reload()"
          >
            ↩️ กลับหน้าหลัก
          </button>

        `;

      }

    }


    // =====================================
    // ตรวจสอบฟอร์มก่อนบันทึก
    // =====================================

    function reviewBookingForm() {

      const carId =
        document.getElementById(
          'carId'
        ).value;


      const startDateTime =
        document.getElementById(
          'startDateTime'
        ).value;


      const endDateTime =
        document.getElementById(
          'endDateTime'
        ).value;


      const destination =
        document.getElementById(
          'destination'
        )
        .value
        .trim();


      const purpose =
        document.getElementById(
          'purpose'
        )
        .value
        .trim();


      if (!carId) {

        alert(
          'กรุณาเลือกรถ'
        );

        return;

      }


      if (!startDateTime) {

        alert(
          'กรุณาระบุวันและเวลาเริ่มใช้รถ'
        );

        return;

      }


      if (!endDateTime) {

        alert(
          'กรุณาระบุวันและเวลาคืนรถ'
        );

        return;

      }


      if (!destination) {

        alert(
          'กรุณาระบุสถานที่ไป'
        );

        return;

      }


      if (!purpose) {

        alert(
          'กรุณาระบุวัตถุประสงค์'
        );

        return;

      }


      const start =
        new Date(
          startDateTime
        );


      const end =
        new Date(
          endDateTime
        );


      if (
        isNaN(start.getTime()) ||
        isNaN(end.getTime())
      ) {

        alert(
          'รูปแบบวันเวลาไม่ถูกต้อง'
        );

        return;

      }


      if (end <= start) {

        alert(
          'วันเวลาคืนรถต้องมากกว่าวันเวลาเริ่มใช้รถ'
        );

        return;

      }


      pendingBooking = {

        carId: carId,

        startDateTime:
          startDateTime,

        endDateTime:
          endDateTime,

        destination:
          destination,

        purpose:
          purpose

      };


      const app =
        document.getElementById(
          'app'
        );


      app.innerHTML = `

        <h3>
          🔍 ตรวจสอบข้อมูลการจอง
        </h3>


        <p>
          🚘 รถ:
          ${escapeHtml(
            carId
          )}
        </p>


        <p>
          📅 เริ่ม:
          ${formatDateTime(
            start
          )}
        </p>


        <p>
          📅 คืน:
          ${formatDateTime(
            end
          )}
        </p>


        <p>
          📍 สถานที่:
          ${escapeHtml(
            destination
          )}
        </p>


        <p>
          📝 วัตถุประสงค์:
          ${escapeHtml(
            purpose
          )}
        </p>


        <hr>


        <button
          onclick="confirmBookingForm()"
        >
          ✅ ยืนยันข้อมูล
        </button>


        <br><br>


        <button
          onclick="openBooking()"
        >
          ✏️ แก้ไขข้อมูล
        </button>


        <br><br>


        <button
          onclick="location.reload()"
        >
          ↩️ กลับหน้าหลัก
        </button>

      `;

    }


    // รองรับชื่อฟังก์ชันเดิม ถ้ามีปุ่มเก่าเรียกใช้
    function submitBookingForm() {

      reviewBookingForm();

    }


    // =====================================
    // บันทึก Booking
    // =====================================

    async function confirmBookingForm() {

      if (!pendingBooking) {

        alert(
          '❌ ไม่พบข้อมูลการจอง'
        );

        return;

      }


      const app =
        document.getElementById(
          'app'
        );


      try {

        const profile =
          await liff.getProfile();

        const lineUserId =
          profile.userId;


        const {
          carId,
          startDateTime,
          endDateTime,
          destination,
          purpose
        } = pendingBooking;


        app.innerHTML = `

          <h3>
            ⏳ กำลังบันทึกการจอง...
          </h3>

          <p>
            กรุณารอสักครู่
          </p>

        `;


        const url =

          GAS_URL +

          '?action=createBooking' +

          '&lineUserId=' +

          encodeURIComponent(
            lineUserId
          ) +

          '&carId=' +

          encodeURIComponent(
            carId
          ) +

          '&startDateTime=' +

          encodeURIComponent(
            startDateTime
          ) +

          '&endDateTime=' +

          encodeURIComponent(
            endDateTime
          ) +

          '&destination=' +

          encodeURIComponent(
            destination
          ) +

          '&purpose=' +

          encodeURIComponent(
            purpose
          );


        const result =
          await fetchJson(url);


        console.log(
          'CREATE BOOKING:',
          result
        );


        if (!result.success) {

          throw new Error(
            result.message ||
            'ไม่สามารถสร้างรายการจองได้'
          );

        }


        app.innerHTML = `

          <h3>
            ✅ จองรถสำเร็จ
          </h3>

          <p>
            เลขที่การจอง:
            <strong>
              ${escapeHtml(
                result.bookingId
              )}
            </strong>
          </p>

          <br>

          <button
            onclick="openMyBookings()"
          >
            📋 ดูรายการจองทั้งหมด
          </button>

          <br><br>

          <button
            onclick="location.reload()"
          >
            กลับหน้าหลัก
          </button>

        `;


        pendingBooking =
          null;


      } catch (error) {

        console.error(error);


        app.innerHTML = `

          <h3>
            ❌ ไม่สามารถจองรถได้
          </h3>

          <p>
            ${escapeHtml(
              error.message
            )}
          </p>

          <br>

          <button
            onclick="openBooking()"
          >
            กลับไปกรอกการจองใหม่
          </button>

        `;

      }

    }


    // =====================================
    // Mileage
    // =====================================

    async function openMileage() {

      const app =
        document.getElementById(
          'app'
        );


      app.innerHTML = `

        <h3>
          🛣️ ประวัติการใช้รถ
        </h3>

        <p>
          กำลังโหลดข้อมูล...
        </p>

      `;


      try {

        const profile =
          await liff.getProfile();

        const lineUserId =
          profile.userId;


        const url =

          GAS_URL +

          '?action=getMileageHistory' +

          '&lineUserId=' +

          encodeURIComponent(
            lineUserId
          );


        const result =
          await fetchJson(url);


        console.log(
          'GET MILEAGE HISTORY:',
          result
        );


        if (!result.success) {

          throw new Error(
            result.message ||
            'ไม่สามารถโหลดประวัติการใช้รถได้'
          );

        }


        if (
          !result.mileage ||
          result.mileage.length === 0
        ) {

          app.innerHTML = `

            <h3>
              🛣️ ประวัติการใช้รถ
            </h3>

            <p>
              ยังไม่มีประวัติการใช้รถ
            </p>

            <button
              onclick="location.reload()"
            >
              ↩️ กลับหน้าหลัก
            </button>

          `;

          return;

        }


        let html = `

          <h3>
            🛣️ ประวัติการใช้รถ
          </h3>

        `;


        result.mileage
          .forEach(item => {

            html += `

              <div
                class="booking-card"
              >

                <p>
                  🔢 เลขที่การจอง:
                  <strong>
                    ${escapeHtml(
                      item.bookingId || '-'
                    )}
                  </strong>
                </p>

                <p>
                  🚘 รถ:
                  ${escapeHtml(
                    item.carId || '-'
                  )}
                </p>

                <p>
                  📍 สถานที่:
                  ${escapeHtml(
                    item.destination || '-'
                  )}
                </p>

                <p>
                  🛣️ เลขไมล์เริ่ม:
                  ${escapeHtml(
                    item.startMileage || '-'
                  )}
                </p>

                <p>
                  🛣️ เลขไมล์สิ้นสุด:
                  ${escapeHtml(
                    item.endMileage || '-'
                  )}
                </p>

                <p>
                  📏 ระยะทาง:
                  ${escapeHtml(
                    item.distanceKm || '-'
                  )}
                  กม.
                </p>

                <p>
                  📅 วันที่บันทึก:
                  ${
                    item.recordedAt
                      ? formatDateTime(
                          new Date(
                            item.recordedAt
                          )
                        )
                      : '-'
                  }
                </p>

              </div>

            `;

          });


        html += `

          <br>

          <button
            onclick="location.reload()"
          >
            ↩️ กลับหน้าหลัก
          </button>

        `;


        app.innerHTML =
          html;


      } catch (error) {

        console.error(error);


        app.innerHTML = `

          <h3>
            🛣️ ประวัติการใช้รถ
          </h3>

          <p>
            ❌
            ${escapeHtml(
              error.message
            )}
          </p>

          <button
            onclick="location.reload()"
          >
            ↩️ กลับหน้าหลัก
          </button>

        `;

      }

    }


    // =====================================
    // START
    // =====================================

    startLIFF();

  </script>
