<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ระบบจองรถ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>


<body>

  <h2>🚗 ระบบจองรถ</h2>

  <div id="app">

    <div id="status">
      กำลังเริ่มระบบ...
    </div>

  </div>


  <script>

    // =====================================
    // CONFIG
    // =====================================

    const LIFF_ID =
      '2011261923-yetmmlij';

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbwAqXQE9O2OGABOzbUrelsRqWv8holDq6sYXx2JQOAkgpBYftksidK0WKqPhxa30QK4/exec';


    // =====================================
    // START LIFF
    // =====================================

    async function startLIFF() {

      const status =
        document.getElementById('status');


      try {

        // ---------------------------------
        // 1. LIFF INIT
        // ---------------------------------

        status.innerText =
          '1. กำลังเริ่ม LIFF...';

        await liff.init({
          liffId: LIFF_ID
        });


        // ---------------------------------
        // 2. LOGIN
        // ---------------------------------

        status.innerText =
          '2. กำลังตรวจสอบ LINE Login...';


        if (!liff.isLoggedIn()) {

          liff.login();

          return;

        }


        // ---------------------------------
        // 3. GET PROFILE
        // ---------------------------------

        status.innerText =
          '3. กำลังอ่านข้อมูลผู้ใช้งาน...';


        const profile =
          await liff.getProfile();


        const lineUserId =
          profile.userId;

        const name =
          profile.displayName;


        // ---------------------------------
        // 4. CHECK USER
        // ---------------------------------

        status.innerText =
          '4. กำลังตรวจสอบสิทธิ์...';


        const url =

          GAS_URL +

          '?action=checkLIFFUser' +

          '&lineUserId=' +

          encodeURIComponent(lineUserId);


        const response =
          await fetch(url);


        const result =
          await response.json();


        console.log(
          'CHECK USER:',
          result
        );


        // ---------------------------------
        // 5. CHECK RESULT
        // ---------------------------------

        if (!result.success) {

          throw new Error(
            result.message ||
            'ไม่สามารถตรวจสอบผู้ใช้งานได้'
          );

        }


        // ---------------------------------
        // 6. USER NOT FOUND
        // ---------------------------------

        if (!result.found) {

          status.innerHTML =

            '❌ ไม่พบผู้ใช้งานในระบบ' +

            '<br><br>' +

            'LINE ของคุณยังไม่ได้รับอนุญาต' +

            '<br>' +

            'กรุณาติดต่อผู้ดูแลระบบ';

          return;

        }


        // ---------------------------------
        // 7. CHECK STATUS
        // ---------------------------------

        if (
          String(result.status)
            .toLowerCase() !== 'active'
        ) {

          status.innerHTML =

            '⛔ บัญชีของคุณไม่สามารถใช้งานได้' +

            '<br><br>' +

            'Status: ' +
            result.status;

          return;

        }


        // ---------------------------------
        // 8. SHOW MAIN MENU
        // ---------------------------------

        showMainMenu(result);


      } catch (error) {

        console.error(error);


        status.innerHTML =

          '❌ เกิดข้อผิดพลาด' +

          '<br><br>' +

          error.message;

      }

    }


    // =====================================
    // MAIN MENU
    // =====================================

    function showMainMenu(user) {

      const app =
        document.getElementById('app');


      app.innerHTML = `

        <h3>🚗 ระบบจองรถ</h3>

        <p>
          👤 ชื่อ: ${user.name}
        </p>

        <p>
          🏢 Department:
          ${user.department || '-'}
        </p>

        <hr>

        <button
          onclick="openBooking()"
        >
          🚗 จองรถ
        </button>

        <br><br>

        <button
          onclick="openMyBookings()"
        >
          📋 รายการจองของฉัน
        </button>

        <br><br>

        <button
          onclick="openMileage()"
        >
          🛣️ ประวัติการใช้รถ
        </button>

      `;

    }


    // =====================================
    // MENU FUNCTIONS
    // =====================================

    async function openBooking() {

  const app =
    document.getElementById('app');


  app.innerHTML = `

    <h3>🚗 จองรถ</h3>

    <div id="bookingStatus">
      กำลังโหลดรายการรถ...
    </div>

  `;


  try {

    // =====================================
    // อ่าน LINE User
    // =====================================

    const profile =
      await liff.getProfile();

    const lineUserId =
      profile.userId;


    // =====================================
    // ดึงรถ Available
    // =====================================

    const url =

      GAS_URL +

      '?action=getAvailableCars' +

      '&lineUserId=' +

      encodeURIComponent(lineUserId);


    const response =
      await fetch(url);


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        'ไม่สามารถโหลดข้อมูลรถได้'
      );

    }


    // =====================================
    // ไม่มีรถ
    // =====================================

    if (
      !result.cars ||
      result.cars.length === 0
    ) {

      app.innerHTML = `

        <h3>🚗 จองรถ</h3>

        <p>
          ❌ ไม่พบรถที่พร้อมใช้งาน
        </p>

        <button
          onclick="location.reload()"
        >
          กลับหน้าหลัก
        </button>

      `;

      return;

    }


    // =====================================
    // สร้างรายการรถ
    // =====================================

    let options = '';


    result.cars.forEach(car => {

      const label = [

        car.carType,
        car.brand,
        car.model,
        car.licensePlate

      ]
      .filter(Boolean)
      .join(' - ');


      options += `

        <option value="${car.carId}">
          ${label}
        </option>

      `;

    });


    // =====================================
    // แสดงแบบฟอร์ม
    // =====================================

    app.innerHTML = `

      <h3>🚗 จองรถ</h3>


      <!-- รถ -->

      <label>
        🚘 เลือกรถ
      </label>

      <br>

      <select
        id="carId"
        required
      >

        <option value="">
          -- เลือกรถ --
        </option>

        ${options}

      </select>


      <br><br>


      <!-- วันเวลาเริ่ม -->

      <label>
        📅 วันและเวลาเริ่มใช้รถ
      </label>

      <br>

      <input
        type="datetime-local"
        id="startDateTime"
        required
      />


      <br><br>


      <!-- วันเวลาสิ้นสุด -->

      <label>
        📅 วันและเวลาคืนรถ
      </label>

      <br>

      <input
        type="datetime-local"
        id="endDateTime"
        required
      />


      <br><br>


      <!-- Destination -->

      <label>
        📍 สถานที่ไป
      </label>

      <br>

      <input
        type="text"
        id="destination"
        placeholder="เช่น สนามบินภูเก็ต"
        required
      />


      <br><br>


      <!-- Purpose -->

      <label>
        📝 วัตถุประสงค์
      </label>

      <br>

      <textarea
        id="purpose"
        rows="4"
        placeholder="ระบุวัตถุประสงค์ในการใช้รถ"
        required
      ></textarea>


      <br><br>


      <!-- Buttons -->

      <button
        onclick="submitBookingForm()"
      >
        📤 ตรวจสอบข้อมูล
      </button>


      <button
        onclick="location.reload()"
      >
        ↩️ กลับหน้าหลัก
      </button>

    `;


  } catch (error) {

    app.innerHTML = `

      <h3>🚗 จองรถ</h3>

      <p>
        ❌ ${error.message}
      </p>

      <br>

      <button
        onclick="location.reload()"
      >
        กลับหน้าหลัก
      </button>

    `;

  }

}
    function submitBookingForm() {

  const carId =
    document.getElementById('carId')
      .value;


  const startDateTime =
    document.getElementById('startDateTime')
      .value;


  const endDateTime =
    document.getElementById('endDateTime')
      .value;


  const destination =
    document.getElementById('destination')
      .value
      .trim();


  const purpose =
    document.getElementById('purpose')
      .value
      .trim();


  // =====================================
  // ตรวจข้อมูล
  // =====================================

  if (!carId) {

    alert(
      'กรุณาเลือกรถ'
    );

    return;

  }


  if (!startDateTime) {

    alert(
      'กรุณาระบุวันและเวลาเริ่มใช้รถ'
    );

    return;

  }


  if (!endDateTime) {

    alert(
      'กรุณาระบุวันและเวลาคืนรถ'
    );

    return;

  }


  if (!destination) {

    alert(
      'กรุณาระบุสถานที่ไป'
    );

    return;

  }


  if (!purpose) {

    alert(
      'กรุณาระบุวัตถุประสงค์'
    );

    return;

  }


  // =====================================
  // ตรวจเวลา
  // =====================================

  const start =
    new Date(startDateTime);


  const end =
    new Date(endDateTime);


  if (
    isNaN(start.getTime()) ||
    isNaN(end.getTime())
  ) {

    alert(
      'รูปแบบวันเวลไม่ถูกต้อง'
    );

    return;

  }


  if (end <= start) {

    alert(
      'วันเวลาคืนรถต้องมากกว่าวันเวลาเริ่มใช้รถ'
    );

    return;

  }


  // =====================================
  // แสดงข้อมูลที่กรอก
  // =====================================

  const app =
    document.getElementById('app');


  app.innerHTML = `

    <h3>🔍 ตรวจสอบข้อมูลการจอง</h3>


    <p>
      🚘 รถ:
      ${carId}
    </p>


    <p>
      📅 เริ่ม:
      ${formatDateTime(start)}
    </p>


    <p>
      📅 คืน:
      ${formatDateTime(end)}
    </p>


    <p>
      📍 สถานที่:
      ${escapeHtml(destination)}
    </p>


    <p>
      📝 วัตถุประสงค์:
      ${escapeHtml(purpose)}
    </p>


    <hr>


    <button
      onclick="confirmBookingForm()"
    >
      ✅ ยืนยันข้อมูล
    </button>


    <button
      onclick="openBooking()"
    >
      ✏️ แก้ไขข้อมูล
    </button>


  `;


}
    function formatDateTime(date) {

  return date.toLocaleString(
    'th-TH',
    {
      dateStyle: 'medium',
      timeStyle: 'short'
    }
  );

}
function escapeHtml(text) {

  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}
    function confirmBookingForm() {

  alert(
    'ข้อมูลถูกต้องแล้ว\n\n' +
    'ระบบบันทึก Booking จะสร้างในขั้นตอนถัดไป'
  );

}

    // =====================================
    // START
    // =====================================

    startLIFF();

  </script>

</body>

</html>
