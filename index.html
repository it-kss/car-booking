<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Car Booking</title>

</head>

<body>

<h2>🚗 ระบบจองรถ</h2>

<div id="status">
  กำลังเชื่อมต่อ LINE...
</div>

<div id="profile">

  <p>
    👤 ชื่อ:
    <span id="displayName">-</span>
  </p>

  <p>
    🆔 LINE User ID:
    <span id="userId">-</span>
  </p>

</div>


<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script>

const LIFF_ID = '2011261923-yetmmlij';

const GAS_URL =
'https://script.google.com/macros/s/AKfycbwAqXQE9O2OGABOzbUrelsRqWv8holDq6sYXx2JQOAkgpBYftksidK0WKqPhxa30QK4/exec';


async function startLIFF() {

  try {

    document.getElementById('status').innerText =
      'กำลังเริ่ม LIFF...';


    // เริ่ม LIFF

    await liff.init({
      liffId: LIFF_ID
    });


    // ตรวจสอบ Login

    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    document.getElementById('status').innerText =
      'กำลังอ่านข้อมูล LINE...';


    // อ่าน Profile

    const profile =
      await liff.getProfile();


    const lineUserId =
      profile.userId;

    const name =
      profile.displayName;


    // แสดงข้อมูล

    document.getElementById('displayName')
      .innerText = name;

    document.getElementById('userId')
      .innerText = lineUserId;


    document.getElementById('status').innerText =
      'กำลังบันทึกข้อมูลผู้ใช้งาน...';


    // ส่งข้อมูลไป Apps Script

    const url =
      GAS_URL +
      '?action=saveLIFFUser' +
      '&lineUserId=' +
      encodeURIComponent(lineUserId) +
      '&name=' +
      encodeURIComponent(name);


    const response = await fetch(url);

const result = await response.text();

console.log('Apps Script status:', response.status);
console.log('Apps Script result:', result);

document.getElementById('status').innerText =
  'Apps Script HTTP: ' +
  response.status +
  ' | Result: ' +
  result;


    document.getElementById('status').innerText =
      '✅ เชื่อมต่อระบบสำเร็จ';


  } catch (error) {

    console.error(error);

    document.getElementById('status').innerText =
      '❌ เกิดข้อผิดพลาด: ' +
      error.message;

  }

}


startLIFF();

</script>

</body>

</html>
